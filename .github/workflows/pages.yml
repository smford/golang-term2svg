name: Deploy Documentation to Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag to inject (e.g. v0.1.0)'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Release version tag to inject (e.g. v0.1.0)'
        required: false
        type: string

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-pages:
    name: Build & Deploy Documentation
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Update Documentation Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/update-docs-version.sh docs "${INPUT_VERSION}"

          # Commit updated documentation back to main if changed
          if ! git diff --quiet docs/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/
            git commit -m "docs: sync release version badges in documentation [skip ci]" || true
            git push origin HEAD:main 2>/dev/null || echo "Direct push skipped; documentation deployed as artifact"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
